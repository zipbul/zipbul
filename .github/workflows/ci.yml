name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      - name: Build common
        run: bun run build
        working-directory: packages/common

      - name: Build logger
        run: bun run build
        working-directory: packages/logger

      - name: Build core
        run: bun run build
        working-directory: packages/core

      - name: Build http-adapter
        run: bun run build
        working-directory: packages/http-adapter

      - name: Lint
        run: bunx oxlint@1.48.0
