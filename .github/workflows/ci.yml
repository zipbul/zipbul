name: CI

# Auto-run on push/PR is DISABLED. Run manually (workflow_dispatch) only.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      - name: Build all publishable packages
        run: bun run --filter '@zipbul/*' build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip
