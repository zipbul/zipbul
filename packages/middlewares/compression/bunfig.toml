[test]
onlyFailures = true
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = 0.95
coveragePathIgnorePatterns = [
  "node_modules/**",
  "dist/**",
  "../../libs/shared/**",
  "../../libs/result/**",
  "../../framework/common/**",
  "../../adapters/http/**"
]

[test.reporter]
dots = true
