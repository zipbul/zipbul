[test]
coverageReporter = ["text", "lcov"]
# NOTE: bun measures line + function coverage only, not branch/condition
# coverage — this threshold does NOT guarantee every branch of the parser's
# compound guards is exercised. Branch/mutation testing is a separate concern.
coverageThreshold = 0.95
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "node_modules/**",
  "dist/**",
  "../*/**",
  "../../*/*/**",
  "test/**",
  # src/options.ts is a baker @Recipe schema: bun cannot instrument a decorated
  # class's field declarations, so it structurally cannot reach the gate.
  "src/options.ts",
]

[test.reporter]
dots = true
